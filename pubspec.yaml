name: student_housing_finder
description: Student Housing Finder
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase (The Brain)
  supabase_flutter: ^2.8.0

  # For Cloudinary Upload (Stable & Null Safe)
  http: ^1.2.1

  # State Management
  provider: ^6.1.2

  # Image Picker
  image_picker: ^1.1.2

  # Utils
  uuid: ^4.5.0
  intl: ^0.20.2
  path: ^1.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
